[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

# Admin master password (plaintext, cambiar y rehashear en Settings tras instalación)
admin_passwd = IndigoMaster2026!

# Database connection
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 32

# Worker / limits (ajustar segun specs del VPS)
workers = 0
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Logs
log_level = info
log_handler = :INFO

# HTTP / proxy
proxy_mode = True
# longpolling_port = 8072  # Odoo 17 - configurado via gevent_port

# SMTP - reemplazar en produccion. En dev apunta a MailHog.
smtp_server = mailhog
smtp_port = 1025
smtp_ssl = False
email_from = noreply@indigodecors.local

# Demo data
without_demo = False

# Misc
#
# dbfilter binds this Odoo to indigo-prod. Without it, the moment a SECOND
# database exists on the same Postgres, Odoo stops auto-selecting and serves
# /web/database/selector instead of the site -- which is exactly what took
# indigodecors.com down on 2026-08-17, minutes after a staging database was
# created alongside production. One database had been hiding the gap.
#
# list_db = False removes the database selector and the create/drop UI. It was
# already on the hardening list in CLAUDE.md; the outage made it urgent.
dbfilter = ^indigo-prod$
list_db = False
