<!doctype html><html><head><meta charset="utf-8"><title>Infografía proceso</title>
<style>
  @font-face{font-family:'Montserrat';src:url('file:///C:/Trabajo/_tools/fonts/Montserrat.ttf');font-weight:100 900}
  @font-face{font-family:'Inter';src:url('file:///C:/Trabajo/_tools/fonts/Inter.ttf');font-weight:100 900}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:#0e1f3c;color:#fff;font-family:'Inter',sans-serif;position:relative;
       display:flex;flex-direction:column;padding:64px 72px 56px}
  .kicker{font-family:'Montserrat';font-weight:700;font-size:22px;letter-spacing:.24em;
          color:#b5895a;text-align:center;margin-bottom:18px}
  h1{font-family:'Montserrat';font-weight:800;font-size:84px;line-height:1.02;
     text-align:center;letter-spacing:-.01em;margin-bottom:10px}
  .steps{flex:1;position:relative;margin-top:26px}
  .line{position:absolute;left:239px;top:70px;bottom:70px;width:4px;background:#b5895a;border-radius:2px}
  .row{position:absolute;left:0;right:0;height:150px;display:flex;align-items:center}
  .disc{width:150px;height:150px;border-radius:50%;background:#0e1f3c;border:5px solid #5b8def;
        display:flex;align-items:center;justify-content:center;flex:none;margin-left:166px;
        box-shadow:0 0 0 10px #0e1f3c}
  .disc svg{width:76px;height:76px;color:#9fc0ff}
  .tick{width:58px;height:4px;background:#b5895a;border-radius:2px;margin:0 26px 0 22px;flex:none}
  .lbl b{display:block;font-family:'Montserrat';font-weight:800;font-size:52px;letter-spacing:.02em}
  .lbl span{display:block;font-size:27px;color:#aab7cd;margin-top:6px}
  .foot{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:30px}
  .foot .rule{height:2px;width:120px;background:#31456b}
  .cta{background:#b5895a;color:#0e1f3c;font-family:'Montserrat';font-weight:800;font-size:31px;
       padding:16px 40px;border-radius:99px}
</style></head><body>
<div class="kicker">INDIGO DECORS · MIAMI, FL</div>
<h1>FROM ORDER<br>TO INSTALLED</h1>
<div class="steps">
  <div class="line"></div>
  <div class="row" style="top:0">
    <div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><rect x="9" y="2.6" width="6" height="3" rx="1" fill="#0e1f3c"/><rect x="9" y="2.6" width="6" height="3" rx="1"/>
      <path d="M8.5 10h7M8.5 13.5h7M8.5 17h4.5"/></svg></div>
    <div class="tick"></div><div class="lbl"><b>ORDER</b><span>on the dealer portal — two minutes</span></div>
  </div>
  <div class="row" style="top:186px">
    <div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.5 5.5 18.5 8.5 8.5 18.5 4.5 19.5 5.5 15.5Z"/><path d="M13.7 7.3l3 3"/>
      <path d="M19 13v6h-6"/><path d="M19 16.2h-2.2M16.2 19v-2.2"/></svg></div>
    <div class="tick"></div><div class="lbl"><b>DESIGN</b><span>your pick from the catalog — or custom</span></div>
  </div>
  <div class="row" style="top:372px">
    <div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6v4h-6zM10.5 7h3v4h-3z"/><path d="M12 11v3"/><path d="m12 14 1.6 2.6h-3.2z"/>
      <path d="M4 20h16"/><path d="M6.5 17.6c1.4-1 2.6-1 4 0s2.6 1 4 0 2.6-1 4 0" stroke-width="1.2"/></svg></div>
    <div class="tick"></div><div class="lbl"><b>CNC CUT</b><span>every curve, to the millimeter</span></div>
  </div>
  <div class="row" style="top:558px">
    <div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 3.5 20.5 9.5"/><path d="m16 2 6 6-7.5 7.5-6-6z"/>
      <path d="M8.5 9.5c-2.2 2.2-3.4 2.6-5 3 2.6 1 3.6 3.4 3.2 6 2.6-.4 3.6-1.4 4.8-4.5"/></svg></div>
    <div class="tick"></div><div class="lbl"><b>PAINT</b><span>hand-finished — bronze, white or black</span></div>
  </div>
  <div class="row" style="top:744px">
    <div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 21V4a1 1 0 0 1 1.2-1l5 1.1a1 1 0 0 1 .8 1V19a1 1 0 0 1-.8 1L14.2 21A1 1 0 0 1 13 21Z"/>
      <circle cx="15.6" cy="12" r="1" fill="currentColor"/><path d="M13 21H4V4h9"/><path d="M4 21h16"/></svg></div>
    <div class="tick"></div><div class="lbl"><b>INSTALL</b><span>on site, on the scheduled date</span></div>
  </div>
</div>
<div class="foot"><div class="rule"></div><div class="cta">indigodecors.com</div><div class="rule"></div></div>
</body></html>
